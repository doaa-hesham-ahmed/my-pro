<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="width: 400px;">
        <h2 class="text-center mb-4 fw-bold text-primary"> My To-Do List </h2>

        <div class="input-group mb-3 d-flex justify-content-center gap-2">
            <input type="text" id="taskInput" class="form-control"  placeholder="Enter a task">
            <button class="btn btn-primary" id="addBtn">
                <i class="fa-solid fa-plus"></i> Add
            </button>
        </div>

        <ul class="list-group" id="taskList">
            
        </ul>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
